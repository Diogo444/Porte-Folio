      <stop offset="100%" stop-color="#e833f2"/>
    </linearGradient>

    <linearGradient id="right-gradient" x1="317" y1="11" x2="486" y2="374" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d233f5"/>
      <stop offset="48%" stop-color="#a71df1"/>
      <stop offset="100%" stop-color="#7b16f0"/>
