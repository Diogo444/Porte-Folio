  <desc id="desc">Logo Angular stylisé composé de formes géométriques avec des dégradés rose, magenta et violet sur fond transparent.</desc>

  <defs>
    <linearGradient id="left-gradient" x1="31" y1="374" x2="199" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f61368"/>
